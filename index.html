<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENSTP 360 × Makelty Healthy — Commander</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#26312a;--muted:#6b7a70;--card:#fff;--mist:#f3f7f1;--line:#dbe6d6;--leaf:#2f8f5b;--olive:#6b7a3a;--warn:#fff4dc;--warnfg:#8a5a00}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121712;--fg:#e8efe9;--muted:#9fb0a4;--card:#1b231c;--mist:#1f2a21;--line:#2f3d32;--leaf:#4cbf80;--olive:#b7c97a;--warn:#3a2f10;--warnfg:#ffd98a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.w{max-width:960px;margin:auto;padding:0 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0}
header img{height:48px;max-width:38%;object-fit:contain}
.x{display:flex;align-items:center;gap:4px;color:var(--leaf)}.x i{width:22px;height:1px;background:var(--line)}
.x b{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--mist)}
h1{font-size:clamp(26px,6vw,44px);color:var(--olive);margin:.4em 0 .2em;text-align:center;letter-spacing:-.02em}
.sub{text-align:center;color:var(--muted);max-width:560px;margin:0 auto 16px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.info div{background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-weight:600}
.info small{display:block;color:var(--olive);font-weight:500;text-transform:uppercase;font-size:11px}
.ban{background:var(--warn);color:var(--warnfg);border-radius:16px;padding:14px;text-align:center;font-weight:600;margin:12px 0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;z-index:5}
.tabs button{border:0;border-radius:99px;padding:8px 16px;background:var(--mist);color:var(--olive);font:600 14px inherit;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--leaf);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(80,110,60,.1);display:flex;flex-direction:column;animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card img{width:100%;height:170px;object-fit:cover;background:var(--mist)}
.card .b{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.row{display:flex;justify-content:space-between;gap:8px}.pr{color:var(--olive);font-weight:700;white-space:nowrap}
.k{font-size:12px;color:var(--leaf)}.d{font-size:13px;color:var(--muted);flex:1}
.ctl{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-top:6px}
.ctl button,.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--leaf);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer}
.ctl .add,.ctl button.p{background:var(--leaf);color:#fff;border:0}.ctl .add:disabled{background:#b9c2bb}
.bar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:440px;margin:auto;background:var(--leaf);color:#fff;border:0;border-radius:99px;padding:16px 24px;display:flex;justify-content:space-between;font:700 16px inherit;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;animation:up .3s}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;align-items:end;z-index:20}
.md{background:var(--card);max-width:460px;width:100%;margin:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .3s}
.md h2{margin:0 0 10px}.li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}.li span:first-child{flex:1}
.q{display:flex;align-items:center;gap:6px}.q button{width:30px;height:30px;font-size:16px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:14px 0}
.cta{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:99px;background:var(--leaf);color:#fff;padding:14px;font:700 16px inherit;cursor:pointer;margin-top:8px}
.cta.s{background:transparent;color:var(--fg);border:1px solid var(--line)}.cta:disabled{background:#b9c2bb}
label{display:block;font-size:14px;margin:10px 0}input,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit}
.er{color:#c0392b;font-size:12px}.ok{text-align:center}.ok b{color:var(--olive)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.nav{display:flex;justify-content:center;gap:22px;font-size:14px;margin-bottom:6px}.nav a{color:var(--muted);text-decoration:none}.nav .adm{opacity:.45}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}.st div{background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:12px}.st small{color:var(--olive)}.st b{display:block;font-size:28px;color:var(--leaf)}
.oc{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:var(--card)}.oc.n{border-color:#e0a82e}.bd{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-nouvelle{background:#fde9b8;color:#7a5200}.s-vue{background:#d8ecfb;color:#0b4f7a}.s-en_preparation{background:#ffe0c7;color:#8a3b00}.s-prete{background:#d4f1de;color:#16663a}.s-recuperee{background:#e6e8e6;color:#555}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.chips button{border:0;border-radius:99px;padding:6px 14px;background:var(--mist);color:var(--olive);font:600 13px inherit;cursor:pointer;white-space:nowrap}.chips .on{background:var(--leaf);color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;max-width:360px;margin:auto;background:var(--leaf);color:#fff;border-radius:16px;padding:14px;text-align:center;font-weight:700;z-index:30}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}.top button,.sm{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 24px;font-size:14px}.pl div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.adv{border:0;border-radius:99px;background:var(--leaf);color:#fff;padding:9px 16px;font:700 14px inherit;cursor:pointer}[hidden]{display:none!important}
