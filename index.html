<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ENSTP 360 × Makelty Healthy — Commander</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#26312a;--muted:#6b7a70;--card:#fff;--mist:#f3f7f1;--line:#dbe6d6;--leaf:#2f8f5b;--olive:#6b7a3a;--warn:#fff4dc;--warnfg:#8a5a00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.w{max-width:960px;margin:auto;padding:0 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0}
header img{height:48px;max-width:38%;object-fit:contain}
.x{display:flex;align-items:center;gap:4px;color:var(--leaf)}.x i{width:22px;height:1px;background:var(--line)}
.x b{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--mist)}
h1{font-size:clamp(26px,6vw,44px);color:var(--olive);margin:.4em 0 .2em;text-align:center;letter-spacing:-.02em}
.sub{text-align:center;color:var(--muted);max-width:560px;margin:0 auto 16px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.info div{background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-weight:600}
.info small{display:block;color:var(--olive);font-weight:500;text-transform:uppercase;font-size:11px}
.ban{background:var(--warn);color:var(--warnfg);border-radius:16px;padding:14px;text-align:center;font-weight:600;margin:12px 0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;z-index:5}
.tabs button{border:0;border-radius:99px;padding:8px 16px;background:var(--mist);color:var(--olive);font:600 14px inherit;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--leaf);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(80,110,60,.1);display:flex;flex-direction:column;animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card img{width:100%;height:170px;object-fit:cover;background:var(--mist)}
.card .b{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.row{display:flex;justify-content:space-between;gap:8px}.pr{color:var(--olive);font-weight:700;white-space:nowrap}
.k{font-size:12px;color:var(--leaf)}.d{font-size:13px;color:var(--muted);flex:1}
.ctl{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-top:6px}
.ctl button,.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--leaf);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer}
.ctl .add,.ctl button.p{background:var(--leaf);color:#fff;border:0}.ctl .add:disabled{background:#b9c2bb}
.bar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:440px;margin:auto;background:var(--leaf);color:#fff;border:0;border-radius:99px;padding:16px 24px;display:flex;justify-content:space-between;font:700 16px inherit;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;animation:up .3s}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;align-items:end;z-index:20}
.md{background:var(--card);max-width:460px;width:100%;margin:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .3s}
.md h2{margin:0 0 10px}.li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}.li span:first-child{flex:1}
.q{display:flex;align-items:center;gap:6px}.q button{width:30px;height:30px;font-size:16px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:14px 0}
.cta{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:99px;background:var(--leaf);color:#fff;padding:14px;font:700 16px inherit;cursor:pointer;margin-top:8px}
.cta.s{background:transparent;color:var(--fg);border:1px solid var(--line)}.cta:disabled{background:#b9c2bb}
label{display:block;font-size:14px;margin:10px 0}input,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit}
.er{color:#c0392b;font-size:12px}.ok{text-align:center}.ok b{color:var(--olive)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 0 6px}
header img{max-width:100%;height:auto;object-fit:contain}header .lg1{justify-self:end;max-height:64px}header .lg2{justify-self:start;max-height:48px}
.x{justify-self:center}.x i{width:14px}
.card{border-radius:22px}.ph{position:relative;overflow:hidden}.ph img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;transition:transform .5s}.card:hover .ph img{transform:scale(1.05)}
.tag{position:absolute;top:10px;right:10px;background:#fff;color:var(--olive);font-weight:800;border-radius:99px;padding:5px 12px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.nm{font-size:17px}.mac{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;font-weight:600;margin:2px 0}.mac span{background:var(--mist);color:var(--olive);border-radius:99px;padding:2px 8px}.mac span:first-child{color:#c2561a;background:#fff1e6}
.d{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nav{display:flex;justify-content:center;gap:22px;font-size:14px;margin-bottom:6px}.nav a{color:var(--muted);text-decoration:none}.nav .adm{opacity:.45}[hidden]{display:none!important}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;max-width:360px;margin:auto;background:#4cbf80;color:#06130b;border-radius:16px;padding:14px;text-align:center;font-weight:700;z-index:30}
body.adm{background:#000}body.adm header,body.adm .nav{display:none}
#adm{color:#f2f5f2}.ad{max-width:640px;margin:0 auto;padding:14px 0 40px}
.hd{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.hd h1{font-size:22px;margin:0;flex:1 1 100%}
.live{background:#0f2a1a;color:#4cbf80;border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.dots{margin-left:auto;background:#1c1f1d;color:#f2f5f2;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
.dd{position:absolute;right:0;top:100%;z-index:10;background:#1c1f1d;border:1px solid #2a2e2b;border-radius:16px;padding:8px;display:grid;gap:4px;min-width:230px}.dd button{background:none;border:0;color:#f2f5f2;text-align:left;padding:10px;border-radius:10px;font:inherit;cursor:pointer}.dd button:hover{background:#262a27}.dd label{padding:6px 10px;font-size:13px;color:#9aa49d}.dd input,.pn input{background:#111;color:#fff;border-color:#2a2e2b}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#1c1f1d;border:2px solid transparent;border-radius:20px;padding:20px;text-align:left;color:#9aa49d;font:inherit;cursor:pointer}.tile b{display:block;font-size:46px;line-height:1.1;font-weight:600}.tile span{font-size:17px}.tile.g b{color:#4cbf80}.tile.b b{color:#5b9cf5}.tile.o b{color:#f08a4b}.tile.on{border-color:#4cbf80}
.mini{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;color:#9aa49d;font-size:14px}.mini button{background:#1c1f1d;border:1px solid transparent;color:#9aa49d;border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}.mini button.on{border-color:#4cbf80}.mini b{color:#f2f5f2}
.qt{background:#1c1f1d;border-radius:16px;padding:12px 16px;color:#9aa49d}.qt summary{cursor:pointer;color:#f2f5f2}.qt div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-top:1px solid #2a2e2b;margin-top:5px}.qt b{color:#f2f5f2}
.ad h3{font-size:24px;margin:26px 0 8px;font-weight:600}
.or{border-top:1px solid #1f2320;padding:16px 4px;cursor:pointer}.rw{display:flex;justify-content:space-between;gap:12px;align-items:center}.l{display:grid;gap:2px;min-width:0}.l b{font-size:20px;font-weight:600}.l span{color:#9aa49d;font-size:16px}.it{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.s-nouvelle{background:#0d1b33;color:#5b9cf5}.s-vue{background:#1f1836;color:#b79cf5}.s-en_preparation{background:#2b1a0f;color:#f08a4b}.s-prete{background:#0f2418;color:#4cbf80}.s-recuperee{background:#1f2220;color:#9aa49d}
.dt{margin-top:12px;background:#141614;border-radius:16px;padding:14px;display:grid;gap:6px;cursor:default}.r2{display:flex;justify-content:space-between;gap:8px;color:#d5dcd7;font-size:15px}.r2 small{color:#9aa49d}.r2 a{color:#4cbf80}.tt{font-weight:700;border-top:1px solid #2a2e2b;padding-top:8px}
.go{background:#4cbf80;color:#06130b;border:0;border-radius:99px;padding:14px;font:700 16px inherit;cursor:pointer;margin-top:6px}.hs{font-size:12px;color:#7d887f}
.pn{background:#1c1f1d;border-radius:24px;padding:24px;margin-top:20px}.bk{color:#9aa49d;text-decoration:none}.none{text-align:center;color:#9aa49d;padding:30px}

#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,#eef4ea 0,#fff 62%);transition:opacity .7s ease,transform .9s cubic-bezier(.7,0,.3,1)}
#intro.out{opacity:0;transform:scale(1.3);pointer-events:none}
.in{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}.in img{max-width:min(64vw,300px);max-height:22vh;object-fit:contain;opacity:0}
.ix{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--mist);color:var(--leaf);font-size:26px;display:grid;place-items:center;opacity:0}
.tg{margin:10px 0 0;color:var(--olive);font-weight:600;text-align:center;opacity:0}
@keyframes drop{0%{opacity:0;transform:translateY(-100vh);filter:blur(10px)}55%{opacity:1;filter:blur(0)}72%{transform:translateY(16px)}86%{transform:translateY(-6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
.in.play .i1{animation:drop 1s cubic-bezier(.3,.7,.3,1) .15s forwards}.in.play .ix{animation:drop .9s cubic-bezier(.3,.7,.3,1) .85s forwards}.in.play .i2{animation:drop 1s cubic-bezier(.3,.7,.3,1) 1.35s forwards}.in.play .tg{animation:fade .7s ease 2.3s forwards}

.tg{margin-top:46px}h1{margin-top:26px}

  if(step=="recap")h+=`<p><b>${esc(f.first)} ${esc(f.last)}</b> — ${esc(f.phone)}</p>`+L.map(l=>`<div class="li"><span>${l.qty} × ${esc(l.name)}</span><b>${dzd(l.qty*l.price)}</b></div>`).join("");
  h+=`<div class="tot"><span>Total</span><span>${dzd(total())}</span></div>`+(step=="cart"?`<button class="cta" data-a="next" ${o&&L.length?"":"disabled"}>Valider ma commande</button>`:step=="form"?`<button class="cta" data-a="next">Continuer</button>`:`<button class="cta" data-a="send" ${o&&!busy?"":"disabled"}>${busy?"Enregistrement…":"Confirmer la commande"}</button>`)+`<button class="cta s" data-a="${step=="cart"?"close":"back"}">${step=="cart"?"Fermer":"Retour"}</button>`}
 ov.innerHTML=h+"</div></div>"}

async function adminInit(){const{data:{session}}=await sb.auth.getSession();isAdm=false;if(session){const{data}=await sb.rpc("is_admin");if(data)isAdm=true;else await sb.auth.signOut()}

function renderAdmin(){const a=$("#adm");
 if(isAdm===null){a.innerHTML="<p style='text-align:center;padding:60px;color:#9aa49d'>Chargement…</p>";return}

 const T=[["all","Total commandes",L.length,"g"],["nouvelle","Nouvelles",cn("nouvelle"),"b"],["en_preparation","En préparation",cn("en_preparation"),"o"],["prete","Prêtes",cn("prete"),"g"]];

 +(aerr?`<div class="ban">${esc(aerr)}</div>`:"")

 +`<div class="mini"><button class="${fl=="vue"?"on":""}" data-b="fl" data-id="vue">Vues <b>${cn("vue")}</b></button><button class="${fl=="recuperee"?"on":""}" data-b="fl" data-id="recuperee">Récupérées <b>${cn("recuperee")}</b></button><span>Repas à préparer <b>${prep}</b></span></div>`
 +`<details class="qt"><summary>Quantités par produit</summary>${by.length?by.map(([n,q])=>`<div><span>${esc(n)}</span><b>${q}</b></div>`).join(""):"<div>Aucune commande.</div>"}</details>`
 +`<h3>Commandes${fl!="all"?` · ${LB[fl]||""}`:""}</h3>`
 +(shown.map(o=>`<article class="or ${exp==o.id?"x":""}" data-b="tog" data-id="${o.id}"><div class="rw"><div class="l"><b>Commande ${esc(o.number)}</b><span>${esc(o.first_name)} ${esc(o.last_name)} · ${esc(o.phone)}</span><span class="it">${o.order_items.map(i=>`${i.qty} × ${esc(i.name)}`).join(", ")}</span></div><span class="pill s-${o.status}">${LB[o.status]}</span></div>`
  +(exp==o.id?`<div class="dt"><div class="r2"><span>Reçue à ${hm(o.created_at)}</span><a href="tel:${esc(o.phone)}">Appeler</a></div>${o.order_items.map(i=>`<div class="r2"><span>${i.qty} × ${esc(i.name)} <small>${dzd(i.unit_price)}</small></span><span>${dzd(i.qty*i.unit_price)}</span></div>`).join("")}<div class="r2 tt"><span>Total</span><span>${dzd(o.total)}</span></div>${NX[o.status]?`<button class="go" data-b="adv" data-id="${o.id}">${NX[o.status]} →</button>`:""}<div class="hs">${(hist[o.id]||[]).map(x=>`${hm(x.changed_at)} · ${LB[x.status]}`).join("  ›  ")}</div></div>`:"")+`</article>`).join("")||"<p class='none'>Aucune commande.</p>")+"</div>"}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-b]");if(b){const k=b.dataset.b,id=b.dataset.id;
 if(k=="login"){aerr="";const{error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:$("#pw").value});if(error){aerr="Mot de passe incorrect.";renderAdmin()}else adminInit();return}

 if(k=="pw"){menu=false;const p=prompt("Nouveau mot de passe (10 caractères minimum)");if(p){if(p.length<10)alert("10 caractères minimum.");else{const{error}=await sb.auth.updateUser({password:p});alert(error?"Échec du changement.":"Mot de passe modifié.")}}}
 renderAdmin();return}
 const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;if(a=="close"&&e.target!==t)return;
 if(a=="cat")cat=id;if(a=="inc"&&isOpen())cart[id]=Math.min((cart[id]||0)+1,20);
 if(a=="dec"){cart[id]=(cart[id]||1)-1;if(cart[id]<1)delete cart[id]}if(a=="del")delete cart[id];if(a=="inc"||a=="dec"||a=="del"){upd(id);if(step)modal();return}

 if(a=="back")step=step=="recap"?"form":"cart";if(a=="send"){send();return}
 if(a=="end"){step=null;f={last:"",first:"",phone:""}}render()});
